title: Annotate
author: Patrick Laub
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  revealjs-plugins:
    # annotate.js bootstraps itself once Reveal is ready rather than being a
    # reveal plugin object, so `register: false` loads the scripts without
    # adding a name to reveal's plugins array. Order matters: annotate.js
    # returns immediately if `window.perfectFreehand` is not already there, and
    # the geometry/model/pdf modules are what it draws and exports with.
    - name: annotate
      register: false
      self-contained: false
      script:
        - palm-rejection.js
        - perfect-freehand.min.js
        - annotate-geometry.js
        - annotate-model.js
        - annotate-pdf.js
        - annotate.js
        - annotate-pages.js
      config:
        annotate:
          # Growing a blank page by navigating past the last one is what the pad
          # is for and exactly wrong in a lecture deck, so it is off by default.
          # `open` puts the tools in hand from the start, as a blank writing
          # pad wants; a lecture deck opens as a deck and gets a corner button.
          tools: closed
          pages: false
          # How the annotated PDF is made. `generate` draws the pages here;
          # `overlay` reads a PDF published beside the deck and writes the ink
          # into it, keeping the deck's own typography. `{deck}` in pdfSource is
          # this deck's path without its extension.
          pdf: generate
          pdfSource: "{deck}.pdf"
    # The relay that mirrors a presenter's slide position and ink onto the
    # audience's own copy. Inert unless this browser has been given a role and
    # token: without those it opens no socket and contacts no server. It is a
    # separate plugin entry so a deck that never multiplexes still gets the
    # drawing tools without it having to be a separate extension.
    - name: RevealMultiplex
      self-contained: false
      script:
        - socket.io.min.js
        - multiplex.js
