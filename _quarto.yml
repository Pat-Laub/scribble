project:
  type: default
  # Committed to git so GitHub Pages can serve the deck straight from docs/.
  output-dir: docs
  resources:
    - manifest.webmanifest
    - icon-192.png
    - icon-512.png
    - apple-touch-icon.png
  post-render:
    # Give Safari a new URL whenever annotation code changes. The generated
    # filenames use content hashes, matching Quarto's treatment of its CSS.
    - node scripts/fingerprint-annotation-assets.js

format:
  # The fixed 16:9 stage and the reveal.js fixes come from the
  # Pat-Laub/slide-stage format extension, vendored as a git subtree in
  # _extensions/. Refresh it with:
  #   git subtree pull --prefix=_extensions/Pat-Laub/slide-stage \
  #       <repo> dist-vX.Y.Z --squash
  slide-stage-revealjs:
    # A blank writing surface: no title slide, no headings, no theme chrome
    # beyond the slide counter. Everything on screen is drawn by hand.
    # The browser tab / bookmark name. `pagetitle` rather than `title` because
    # a `title` would bring back the title slide this deck does without —
    # without one Quarto names the tab after the file, i.e. "index".
    pagetitle: Scribble
    theme: [white, scribble.scss, _extensions/Pat-Laub/scribble/annotate.scss]
    controls: true
    # Keep both arrows in the bottom-right corner, clear of the drawing tools.
    controls-layout: bottom-right
    # Reveal fades the back arrow to 30% so an audience isn't drawn backwards.
    # Here it is a control you reach for yourself, and at 30% it disappears
    # under ink.
    controls-back-arrows: visible
    navigation-mode: linear
    # One-finger swipe navigation stays available. `palm-rejection.js` fixes a
    # reveal pointer-event edge case where two separate palm contacts can be
    # mistaken for one long swipe; Pencil strokes are intercepted separately by
    # the annotation layer.
    touch: true
    transition: none
    slide-number: c/t
    # The deck is the whole page — no scrollbars, no reveal "scroll view".
    embed-resources: false
    preview-links: false
    # The pad is edge to edge -- no inset content frame and no rail -- so
    # reveal's frame is the whole authored page. scribble.scss zeroes the
    # stage's content insets to match; the two have to agree.
    width: 3744
    height: 2106
    # The MIT-licensed freehand annotation tool. Ink is saved per slide in the
    # browser's localStorage and can be exported. The reveal.js fixes it used to
    # be bundled with now come from the slide-stage extension.
    revealjs-plugins:
      - scribble
    scribble:
      # This deck is the pad: growing a page by navigating past the last one is
      # the point here, and off everywhere else.
      pages: true
    include-in-header: scribble-bootstrap.html
